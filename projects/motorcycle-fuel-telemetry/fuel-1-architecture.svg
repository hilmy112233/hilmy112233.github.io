<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 566" width="880" height="566" role="img" aria-labelledby="ft1">
<title id="ft1">Motorcycle fuel telemetry system architecture, from resistive float sensor to Django and PostgreSQL dashboard</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A65A1B"/></marker></defs><style>
text{font-family:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.hd{font-size:11.5px;font-weight:700;fill:#A65A1B;letter-spacing:1.5px}
.bt{font-size:15px;font-weight:600;fill:#1F4D3A}
.bs{font-size:12.5px;font-weight:400;fill:#34423B}
.cap{font-size:13px;font-weight:400;fill:#34423B}
.tick{font-size:10.5px;font-weight:400;fill:#8A9A92}
</style>
<rect width="880" height="566" fill="#fff"/>
<text x="24" y="34" class="hd">ON THE MOTORCYCLE · ESP32 FIRMWARE</text><rect x="24" y="46" width="200" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="40" y="78" class="bt">Resistive float arm</text><text x="40" y="100" class="bs">0–5 V analog, tank-mounted</text><rect x="244" y="46" width="200" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="260" y="78" class="bt">ADS1115 · 16-bit ADC</text><text x="260" y="100" class="bs">I²C · PGA · 65 536 steps</text><rect x="464" y="46" width="200" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="480" y="78" class="bt">NEO-6M GPS</text><text x="480" y="100" class="bs">UART · Haversine distance</text><rect x="684" y="46" width="172" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="700" y="78" class="bt">Power frontend</text><text x="700" y="100" class="bs">12.6–14.4 V → 5 V buck</text><text x="24" y="168" class="hd">3-TIER DIGITAL FILTERING</text><rect x="24" y="180" width="270" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="40" y="212" class="bt">① 7-sample median</text><text x="40" y="234" class="bs">strips impulse spikes</text><rect x="310" y="180" width="270" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="326" y="212" class="bt">② EMA · α = 0.1</text><text x="326" y="234" class="bs">damps slosh oscillation</text><rect x="596" y="180" width="260" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="612" y="212" class="bt">③ Hysteresis · Δ 0.03 L</text><text x="612" y="234" class="bs">kills idle hunting</text><text x="24" y="302" class="hd">SECURE TRANSPORT</text><rect x="24" y="314" width="416" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="40" y="346" class="bt">JSON payload at 1 Hz</text><text x="40" y="368" class="bs">fuel L · speed · lat/lon · trip km · km/L</text><rect x="460" y="314" width="396" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="476" y="346" class="bt">MQTT over TLS · port 8883</text><text x="476" y="368" class="bs">X.509 certificate validation</text><text x="24" y="436" class="hd">CLOUD ANALYTICS</text><rect x="24" y="448" width="270" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="40" y="480" class="bt">Django ingestion</text><text x="40" y="502" class="bs">Python consumer + ORM</text><rect x="310" y="448" width="270" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="326" y="480" class="bt">PostgreSQL</text><text x="326" y="502" class="bs">time-series telemetry</text><rect x="596" y="448" width="260" height="78" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="612" y="480" class="bt">Rider dashboard</text><text x="612" y="502" class="bs">consumption charts · refuel log</text><line x1="440" y1="130" x2="440" y2="156" stroke="#A65A1B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="440" y1="264" x2="440" y2="290" stroke="#A65A1B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="440" y1="398" x2="440" y2="424" stroke="#A65A1B" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="24" y="556" class="tick">Sampling, filtering and payload assembly all run on-device; only transport and storage leave the motorcycle.</text>
</svg>