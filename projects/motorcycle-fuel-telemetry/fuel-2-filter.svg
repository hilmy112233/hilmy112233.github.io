<rect width="880" height="292" fill="#fff"/>
<text x="24" y="18" class="hd">01 · RAW SENSOR OUTPUT</text><text x="24" y="37" class="bs">Float voltage converted to litres</text><rect x="24" y="50" width="270" height="156" fill="#FBFCFB" stroke="#DCE4DF"/><text x="24" y="230" class="cap">Pothole and ignition spikes ride on top</text><text x="24" y="247" class="cap">of a slow slosh wave.</text><text x="305" y="18" class="hd">02 · AFTER 7-SAMPLE MEDIAN</text><text x="305" y="37" class="bs">Outliers rejected, order preserved</text><rect x="305" y="50" width="270" height="156" fill="#FBFCFB" stroke="#DCE4DF"/><text x="305" y="230" class="cap">Spikes are gone. The slosh wave is</text><text x="305" y="247" class="cap">untouched — exactly as intended.</text><text x="586" y="18" class="hd">03 · EMA α=0.1 + HYSTERESIS</text><text x="586" y="37" class="bs">Reported value snaps to 0.03 L</text><rect x="586" y="50" width="270" height="156" fill="#FBFCFB" stroke="#DCE4DF"/><text x="586" y="230" class="cap">Smooth decline, no hunting while idling</text><text x="586" y="247" class="cap">at a red light.</text><line x1="24" y1="167.3" x2="294" y2="167.3" stroke="#EDF1EE"/><line x1="305" y1="167.3" x2="575" y2="167.3" stroke="#EDF1EE"/><line x1="586" y1="167.3" x2="856" y2="167.3" stroke="#EDF1EE"/><text x="4" y="170.8" class="tick">4L</text><line x1="24" y1="117.5" x2="294" y2="117.5" stroke="#EDF1EE"/><line x1="305" y1="117.5" x2="575" y2="117.5" stroke="#EDF1EE"/><line x1="586" y1="117.5" x2="856" y2="117.5" stroke="#EDF1EE"/><text x="4" y="121.0" class="tick">5L</text><line x1="24" y1="67.7" x2="294" y2="67.7" stroke="#EDF1EE"/><line x1="305" y1="67.7" x2="575" y2="67.7" stroke="#EDF1EE"/><line x1="586" y1="67.7" x2="856" y2="67.7" stroke="#EDF1EE"/><text x="4" y="71.2" class="tick">6L</text><polyline fill="none" stroke="#B9C4BE" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" points="30.0,67.7 31.1,66.6 32.2,65.2 33.2,64.0 34.3,61.6 35.4,61.8 36.5,62.7 37.6,59.7 38.6,58.6 39.7,58.9 40.8,58.7 41.9,57.5 43.0,