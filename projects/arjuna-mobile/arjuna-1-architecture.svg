<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 516" width="880" height="516" role="img" aria-labelledby="aj1">
<title id="aj1">Arjuna Mobile clean architecture layers: presentation widgets, Provider state, and data service layer over the enterprise REST backend</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A65A1B"/></marker></defs><style>
text{font-family:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.hd{font-size:11.5px;font-weight:700;fill:#A65A1B;letter-spacing:1.5px}
.bt{font-size:15px;font-weight:600;fill:#1F4D3A}
.bs{font-size:12.5px;font-weight:400;fill:#34423B}
.cap{font-size:13px;font-weight:400;fill:#34423B}
.tick{font-size:10.5px;font-weight:400;fill:#8A9A92}
</style>
<rect width="880" height="516" fill="#fff"/>
<rect x="24" y="32" width="832" height="106" rx="4" fill="#F3F5F4" stroke="#DCE4DF"/><text x="40" y="58" class="hd">PRESENTATION · FLUTTER WIDGETS</text><rect x="40" y="70" width="250" height="58" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="56" y="96" class="bt">Screens &amp; navigation</text><text x="56" y="116" class="bs">route-level widgets</text><rect x="306" y="70" width="250" height="58" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="322" y="96" class="bt">Design-system components</text><text x="322" y="116" class="bs">Figma-derived library</text><rect x="572" y="70" width="268" height="58" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="588" y="96" class="bt">Responsive layout wrappers</text><text x="588" y="116" class="bs">density + aspect-ratio safe</text><rect x="24" y="164" width="832" height="106" rx="4" fill="#F3F5F4" stroke="#DCE4DF"/><text x="40" y="190" class="hd">STATE MANAGEMENT · PROVIDER</text><rect x="40" y="202" width="400" height="58" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="56" y="228" class="bt">AuthProvider</text><text x="56" y="248" class="bs">global: session, token, expiry</text><rect x="456" y="202" width="384" height="58" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="472" y="228" class="bt">InventoryProvider</text><text x="472" y="248" class="bs">scoped: search, cart, pagination</text><rect x="24" y="296" width="832" height="106" rx="4" fill="#F3F5F4" stroke="#DCE4DF"/><text x="40" y="322" class="hd">DATA &amp; SERVICE LAYER</text><rect x="40" y="334" width="250" height="58" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="56" y="360" class="bt">ApiClient</text><text x="56" y="380" class="bs">REST over HTTPS</text><rect x="306" y="334" width="270" height="58" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="322" y="360" class="bt">JWT interceptor</text><text x="322" y="380" class="bs">refresh + error mapping</text><rect x="592" y="334" width="248" height="58" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="608" y="360" class="bt">DTO models</text><text x="608" y="380" class="bs">JSON encode / decode</text><line x1="14" y1="140" x2="14" y2="162" stroke="#A65A1B" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="866" y1="140" x2="866" y2="162" stroke="#A65A1B" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="14" y1="272" x2="14" y2="294" stroke="#A65A1B" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="866" y1="272" x2="866" y2="294" stroke="#A65A1B" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="24" y="428" width="832" height="62" rx="4" fill="#1F4D3A"/><text x="440" y="456" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#fff">Enterprise backend · REST endpoints</text><text x="440" y="475" text-anchor="middle" style="font-size:12.5px;fill:#CFE0D7">token-authenticated inventory &amp; asset records</text>
<text x="24" y="510" class="tick">Each layer only talks to its immediate neighbour — widgets never build URLs, providers never parse JSON.</text>
</svg>