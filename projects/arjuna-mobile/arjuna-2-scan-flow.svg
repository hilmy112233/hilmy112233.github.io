<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" role="img" aria-labelledby="aj2">
<title id="aj2">Arjuna Mobile barcode scanning loop, from idle through debounce to haptic confirmation and API mutation</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A65A1B"/></marker></defs><style>
text{font-family:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.hd{font-size:11.5px;font-weight:700;fill:#A65A1B;letter-spacing:1.5px}
.bt{font-size:15px;font-weight:600;fill:#1F4D3A}
.bs{font-size:12.5px;font-weight:400;fill:#34423B}
.cap{font-size:13px;font-weight:400;fill:#34423B}
.tick{font-size:10.5px;font-weight:400;fill:#8A9A92}
</style>
<rect width="880" height="316" fill="#fff"/>
<rect x="25" y="66" width="120" height="76" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="37" y="96" style="font-size:13.5px;font-weight:600;fill:#1F4D3A">Idle</text><text x="37" y="116" style="font-size:11.5px;fill:#34423B">scanner screen</text><text x="37" y="131" style="font-size:11.5px;fill:#34423B">mounted</text><line x1="148" y1="104" x2="163" y2="104" stroke="#A65A1B" stroke-width="1.6" marker-end="url(#ar)"/><rect x="167" y="66" width="120" height="76" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="179" y="96" style="font-size:13.5px;font-weight:600;fill:#1F4D3A">Camera stream</text><text x="179" y="116" style="font-size:11.5px;fill:#34423B">mobile_scanner</text><text x="179" y="131" style="font-size:11.5px;fill:#34423B">controller</text><line x1="290" y1="104" x2="305" y2="104" stroke="#A65A1B" stroke-width="1.6" marker-end="url(#ar)"/><rect x="309" y="66" width="120" height="76" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="321" y="96" style="font-size:13.5px;font-weight:600;fill:#1F4D3A">Decode frame</text><text x="321" y="116" style="font-size:11.5px;fill:#34423B">barcode / QR</text><text x="321" y="131" style="font-size:11.5px;fill:#34423B">payload</text><line x1="432" y1="104" x2="447" y2="104" stroke="#A65A1B" stroke-width="1.6" marker-end="url(#ar)"/><rect x="451" y="66" width="120" height="76" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="463" y="96" style="font-size:13.5px;font-weight:600;fill:#1F4D3A">Code matched</text><text x="463" y="116" style="font-size:11.5px;fill:#34423B">asset lookup in</text><text x="463" y="131" style="font-size:11.5px;fill:#34423B">provider</text><line x1="574" y1="104" x2="589" y2="104" stroke="#A65A1B" stroke-width="1.6" marker-end="url(#ar)"/><rect x="593" y="66" width="120" height="76" rx="3" fill="#fff" stroke="#A65A1B" stroke-width="1.5"/><text x="605" y="96" style="font-size:13.5px;font-weight:600;fill:#1F4D3A">Debounce 1.5 s</text><text x="605" y="116" style="font-size:11.5px;fill:#34423B">duplicate</text><text x="605" y="131" style="font-size:11.5px;fill:#34423B">suppressed</text><line x1="716" y1="104" x2="731" y2="104" stroke="#A65A1B" stroke-width="1.6" marker-end="url(#ar)"/><rect x="735" y="66" width="120" height="76" rx="3" fill="#fff" stroke="#DCE4DF" stroke-width="1"/><text x="747" y="96" style="font-size:13.5px;font-weight:600;fill:#1F4D3A">Haptic + POST</text><text x="747" y="116" style="font-size:11.5px;fill:#34423B">confirm, then</text><text x="747" y="131" style="font-size:11.5px;fill:#34423B">mutate API</text><rect x="25" y="182" width="830" height="60" rx="4" fill="#F3F5F4" stroke="#DCE4DF"/><text x="45" y="206" style="font-size:12.5px;font-weight:600;fill:#1F4D3A">Two failure modes this loop is built to avoid</text><text x="45" y="227" style="font-size:12px;fill:#34423B">Hovering over one barcode used to append the same item repeatedly — the debounce window swallows every re-read inside 1.5 s.</text><rect x="25" y="252" width="830" height="44" rx="4" fill="#F3F5F4" stroke="#DCE4DF"/><text x="45" y="279" style="font-size:12px;fill:#34423B">Leaving the route without disposing the controller kept the camera warm and drained battery — lifecycle hooks now release it on pop.</text>
<text x="25" y="312" class="tick">A single scan-to-record round trip, including the two guardrails that keep field operators from corrupting the cart.</text>
</svg>